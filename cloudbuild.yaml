steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--no-cache"
      - "-t"
      - "europe-west1-docker.pkg.dev/ai-sandbox-509717/cloud-run-source-deploy/nestjs-sandbox-fe/nestjs-sandbox-fe:$COMMIT_SHA"
      - "."
      - "-f"
      - "Dockerfile"
      - "--build-arg"
      - "API_URL=$_API_URL"
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "europe-west1-docker.pkg.dev/ai-sandbox-509717/cloud-run-source-deploy/nestjs-sandbox-fe/nestjs-sandbox-fe:$COMMIT_SHA"
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: "gcloud"
    args:
      - "run"
      - "services"
      - "update"
      - "nestjs-sandbox-fe"
      - "--image"
      - "europe-west1-docker.pkg.dev/ai-sandbox-509717/cloud-run-source-deploy/nestjs-sandbox-fe/nestjs-sandbox-fe:$COMMIT_SHA"
      - "--region"
      - "europe-west1"
substitutions:
  _API_URL: "https://nestjs-sandbox-975532408780.europe-west1.run.app" # Set your default value or define it in the Console Trigger
