services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:?Set API_URL in .env or your shell environment}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "${APP_PORT:-5173}:8080"
    environment:
      PORT: 8080
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:$$PORT/healthz >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
